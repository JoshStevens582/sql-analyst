# Local dev only: desk on http://127.0.0.1:8088
# VPS production: docker compose -f deploy/compose.edge.yml up -d --build  (HTTPS via Caddy)

services:
  sql-analyst:
    build: .
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      SQL_ANALYST_DATABASE_PATH: /app/data/demo.db
    volumes:
      - sql_analyst_data:/app/data

volumes:
  sql_analyst_data: